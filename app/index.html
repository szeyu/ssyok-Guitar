<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guitar practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://api.fontshare.com"><link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<section id="library" class="screen">
  <h1>Pick a song</h1>
  <p class="lead">Each song shows its chords and how it is strummed. Start with the ones that have few chords and no capo.</p>
  <div id="songBox"></div>
  <div class="fileNote hint" id="fileNote"></div>
</section>

<section id="songScreen" class="screen" hidden>
  <header class="prepHead">
    <div>
      <button id="songBack" class="ghost back" type="button">Songs</button>
      <h1 id="songTitle"></h1>
      <p id="songMeta" class="meta"></p>
    </div>
    <div class="capo">
      <div class="capoRow" role="group" aria-label="Capo fret"><span>Capo</span><div id="capo" class="pills"></div></div>
      <p id="capoNote" class="hint"></p>
    </div>
  </header>
  <div class="prepGrid">
    <div>
      <h2>Chords you need</h2>
      <div id="voicings"></div>
      <div id="picker" hidden></div>
      <div class="legend"><span><b class="f1">1</b>index</span><span><b class="f2">2</b>middle</span><span><b class="f3">3</b>ring</span><span><b class="f4">4</b>pinky</span>
        <button id="suggest" class="ghost" type="button" title="Picks the fingerings that move your fingers least between this song's chords">Suggest easiest fingerings</button></div>
    </div>
    <div>
      <h2>The strum</h2>
      <div id="strums" class="strums"></div>
      <h2>Start</h2>
      <!-- ponytail: Learn the strum and the links lead to screens later tickets build (strum steps 06, whole-song sheet and builder 09); no-ops until then -->
      <div class="ways">
        <button id="goSteps" type="button"><i>1</i><b>Learn the strum</b><span>Step by step, slowly, over the first chords</span></button>
        <button id="goSlow" type="button"><i>2</i><b>Play it slowly</b><span id="slowNote"></span></button>
        <button id="goPlay" type="button" class="main"><i>3</i><b>Play along</b><span id="playNote"></span></button>
      </div>
      <div class="links"><button id="whole" class="ghost" type="button">Whole song</button><button id="edit" class="ghost" type="button">Edit song</button></div>
    </div>
  </div>
</section>

<section id="player" class="player" aria-label="Player" hidden>
  <header class="pbar">
    <button id="playerHome" class="ghost" type="button">Songs</button>
    <button id="playerSong" class="ptitle" type="button" title="Chords and capo for this song"></button>
    <ol id="timeline" class="timeline" aria-label="Sections, click one to jump to it"></ol>
    <button id="toolsBtn" type="button" aria-expanded="false" aria-controls="tools">Tools</button>
  </header>
  <div id="tools" class="tools" role="group" aria-label="Tools" hidden>
    <button id="melody" type="button" aria-pressed="true"><span>Melody<small>Plays the tune over the chords, for songs that have one</small></span></button>
    <button id="ramp" type="button" aria-pressed="false"><span>Speed up each loop<small>Adds 5 bpm every time a loop comes round</small></span></button>
  </div>
  <div class="stage">
    <div class="views">
      <div class="view"><div class="scene"></div><span class="tag">Fretting hand</span></div>
      <div class="view"><div class="scene"></div><span class="tag">Strumming hand</span></div>
    </div>
    <div class="laneSheet">
      <canvas id="lane" class="lane" tabindex="0" title="Click a bar to jump to it, or use the left and right arrows" aria-label="Strum lane. Left and right arrows jump a bar; Space plays and pauses">The strum lane: strokes fall to the hit line.</canvas>
      <div class="lyric"><p id="lyricNow"></p><p id="lyricNext" class="nx"></p></div>
    </div>
  </div>
  <footer class="transport">
    <button id="reset" class="iconBtn" type="button" aria-label="Back to the start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button id="play" class="playBtn" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></button>
    <label class="ctl">Tempo <input id="tempo" type="range" step="1"> <output id="bpm" class="bpm" for="tempo"></output><small id="pulse" class="hint" hidden>dotted-quarter beats</small></label>
    <div class="ctl" role="group" aria-label="Loop">Loop <div id="loop" class="pills wide"></div></div>
    <p class="keys"><kbd>Space</kbd> play</p>
  </footer>
</section>
</body>
</html>
